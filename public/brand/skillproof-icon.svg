<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" role="img" aria-label="SkillProof icon">
  <defs>
    <linearGradient id="sp-icon-grad" x1="6" y1="6" x2="58" y2="58" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#E31B23"/>
      <stop offset="0.55" stop-color="#F97316"/>
      <stop offset="1" stop-color="#FF8A00"/>
    </linearGradient>
    <linearGradient id="sp-icon-glow" x1="20" y1="20" x2="44" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Rounded square shield body -->
  <rect x="4" y="4" width="56" height="56" rx="14" fill="url(#sp-icon-grad)"/>

  <!-- Subtle inner highlight for depth -->
  <rect x="4" y="4" width="56" height="56" rx="14" fill="url(#sp-icon-glow)"/>

  <!-- Skill cross — subtle "+" notch in upper-right of the shield -->
  <g transform="translate(40 16)">
    <rect x="0" y="6" width="14" height="2.5" rx="1.25" fill="#ffffff" fill-opacity="0.85"/>
    <rect x="6" y="0" width="2.5" height="14" rx="1.25" fill="#ffffff" fill-opacity="0.85"/>
  </g>

  <!-- Verification checkmark (skill + proof combined) -->
  <path
    d="M18 36 L28 44 L46 26"
    fill="none"
    stroke="#ffffff"
    stroke-width="5"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
</svg>
